name: CI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq
          # Try to install kcov, but don't fail if unavailable (not in Ubuntu 24.04 repos)
          sudo apt-get install -y kcov || echo "kcov not available, skipping coverage collection"

      - name: Make scripts executable
        run: chmod +x *.sh

      - name: Run environment check (without API keys)
        run: |
          # This should fail without API keys, which is expected
          bash 00_check_env.sh || echo "Environment check failed as expected (no API keys in CI)"

      - name: Run test suite with coverage
        run: |
          # Run tests with kcov for coverage if available
          if command -v kcov &> /dev/null; then
            echo "Running tests with kcov coverage collection..."
            mkdir -p coverage
            kcov --exclude-pattern=/usr/include coverage bash tests.sh || true
            echo "Coverage collection completed"
          else
            echo "kcov not available, running tests without coverage collection..."
          fi
          
          # Always run tests normally to ensure they pass
          bash tests.sh

      - name: Verify all scripts are executable
        run: |
          for script in *.sh; do
            if [ ! -x "$script" ]; then
              echo "Error: $script is not executable"
              exit 1
            fi
          done
          echo "All scripts are executable"

      - name: Run shellcheck (enforced)
        run: |
          # ShellCheck is pre-installed on ubuntu-latest
          echo "Running shellcheck on all scripts..."
          shellcheck *.sh agents/*.sh
          echo "✓ ShellCheck passed"

      - name: Verify installer script structure
        run: |
          # Check that the installer contains all necessary files
          grep -q "ai_cli.sh" install_toolkit.sh || exit 1
          grep -q "clip_summarize.sh" install_toolkit.sh || exit 1
          grep -q "url_summarize.sh" install_toolkit.sh || exit 1
          grep -q "file_summarize.sh" install_toolkit.sh || exit 1
          grep -q "00_check_env.sh" install_toolkit.sh || exit 1
          echo "Installer script contains all expected components"

      - name: Generate coverage report
        run: |
          if [ -d coverage ]; then
            echo "Coverage report generated in coverage/"
            # Check if we have reasonable coverage (informational for now)
            if command -v kcov &> /dev/null; then
              echo "Coverage collection is enabled"
              # Note: We don't enforce coverage thresholds yet
              # Target is 85% but we'll measure first
            fi
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  lint:
    name: Lint Markdown Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for broken links in README
        run: |
          # Basic check for common markdown issues
          for md in *.md; do
            echo "Checking $md"
            # Check for empty links
            if grep -q '\[\](' "$md"; then
              echo "Error: Empty link text found in $md"
              exit 1
            fi
          done
          echo "All markdown files look good"

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          # Check for potential hardcoded API keys
          if grep -r "sk-[a-zA-Z0-9]\{32,\}" --exclude-dir=.git .; then
            echo "Error: Potential hardcoded OpenAI API key found"
            exit 1
          fi
          if grep -r "AIza[a-zA-Z0-9_-]\{35\}" --exclude-dir=.git .; then
            echo "Error: Potential hardcoded Google API key found"
            exit 1
          fi
          echo "No hardcoded secrets detected"

      - name: Verify env template has no real keys
        run: |
          # Make sure template doesn't contain real API keys
          if grep -E '(OPENAI_API_KEY|GEMINI_API_KEY)="[^.]' 01_env_template.sh | grep -v '# export'; then
            echo "Error: Real API key may be present in template"
            exit 1
          fi
          echo "Environment template is clean"
