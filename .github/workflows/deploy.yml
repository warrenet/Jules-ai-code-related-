name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    branches: ["main"]
  # Allows manual trigger from Actions tab
  workflow_dispatch:

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    name: Build for GitHub Pages
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect static assets
        id: detect-assets
        run: |
          # Check for common static web files
          if [ -f "index.html" ] || [ -f "index.htm" ]; then
            echo "has_static=true" >> $GITHUB_OUTPUT
            echo "✓ Static HTML files detected (index.html found)"
          elif [ -d "public" ] || [ -d "dist" ] || [ -d "build" ]; then
            echo "has_static=true" >> $GITHUB_OUTPUT
            echo "✓ Static asset directories detected"
          else
            echo "has_static=false" >> $GITHUB_OUTPUT
            echo "ℹ No static assets detected for GitHub Pages deployment"
          fi

      - name: Setup Pages
        if: steps.detect-assets.outputs.has_static == 'true'
        uses: actions/configure-pages@v4

      - name: Build site
        if: steps.detect-assets.outputs.has_static == 'true'
        run: |
          # If there's a build script, run it
          if [ -f "package.json" ] && grep -q '"build"' package.json; then
            echo "Running npm build..."
            npm ci
            npm run build
          else
            echo "No build script found, using files as-is"
          fi

      - name: Prepare deployment directory
        if: steps.detect-assets.outputs.has_static == 'true'
        run: |
          # Determine which directory to deploy
          if [ -d "dist" ]; then
            DEPLOY_DIR="dist"
          elif [ -d "build" ]; then
            DEPLOY_DIR="build"
          elif [ -d "public" ]; then
            DEPLOY_DIR="public"
          elif [ -f "index.html" ]; then
            DEPLOY_DIR="."
          else
            echo "Error: Could not determine deployment directory"
            exit 1
          fi
          
          echo "Deploying from: $DEPLOY_DIR"
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> $GITHUB_ENV
          
          # List files that will be deployed
          echo "Files to be deployed:"
          ls -lah "$DEPLOY_DIR"

      - name: Upload artifact
        if: steps.detect-assets.outputs.has_static == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_DIR }}

      - name: Skip deployment notice
        if: steps.detect-assets.outputs.has_static == 'false'
        run: |
          echo "================================================"
          echo "GitHub Pages deployment skipped"
          echo "================================================"
          echo ""
          echo "No static assets detected for deployment."
          echo ""
          echo "To enable GitHub Pages deployment:"
          echo "1. Add an index.html file to the repository root, or"
          echo "2. Create a public/, dist/, or build/ directory with your static assets"
          echo ""
          echo "This repository appears to be primarily shell scripts."
          echo "GitHub Pages is designed for static websites (HTML, CSS, JS)."
          echo ""

  # Deployment job
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.has_static == 'true'
    
    steps:
# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  detect-static-assets:
    name: Detect Static Assets
    runs-on: ubuntu-latest
    outputs:
      has-static-site: ${{ steps.check.outputs.has-static-site }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check for static site assets
        id: check
        run: |
          # Check for index.html or common static site patterns
          if [ -f "index.html" ] || [ -d "site" ] || [ -d "public" ] || [ -d "dist" ]; then
            echo "has-static-site=true" >> $GITHUB_OUTPUT
            echo "✓ Static site assets detected"
          else
            echo "has-static-site=false" >> $GITHUB_OUTPUT
            echo "ℹ No static site assets found"
          fi

  deploy:
    name: Deploy to Pages
    needs: detect-static-assets
    if: needs.detect-static-assets.outputs.has-static-site == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          # Copy static assets to deployment directory
          if [ -f "index.html" ]; then
            cp index.html _site/
          fi
          if [ -f "script.js" ]; then
            cp script.js _site/
          fi
          # Copy any other static assets
          if [ -d "assets" ]; then
            cp -r assets _site/
          fi
          if [ -d "css" ]; then
            cp -r css _site/
          fi
          if [ -d "js" ]; then
            cp -r js _site/
          fi
          if [ -d "images" ]; then
            cp -r images _site/
          fi
          if [ -d "img" ]; then
            cp -r img _site/
          fi
          # If site/public/dist directories exist, use those
          if [ -d "site" ]; then
            cp -r site/* _site/
          fi
          if [ -d "public" ]; then
            cp -r public/* _site/
          fi
          if [ -d "dist" ]; then
            cp -r dist/* _site/
          fi
          echo "Deployment directory contents:"
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "✅ Successfully deployed to GitHub Pages"
          echo "🌐 Site URL: ${{ steps.deployment.outputs.page_url }}"
  skip-deployment:
    name: Skip Deployment
    needs: detect-static-assets
    if: needs.detect-static-assets.outputs.has-static-site == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: No static assets found
        run: |
          echo "ℹ️  No static site assets detected in this repository."
          echo "This workflow will only deploy when static files (index.html, site/, public/, or dist/) are present."
          echo "To enable GitHub Pages deployment, add static site files to the repository."
